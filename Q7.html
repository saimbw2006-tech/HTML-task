<!DOCTYPE html>
<html>
<head>
    <title>My Landing Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #333;
        }

        section {
            padding: 50px 20px;
            text-align: center;
        }

        h1, h2 {
            margin-top: 0;
        }

        .hero {
            background-color: #2c3e50;
            color: white;
            padding: 100px 20px;
        }

        .hero button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .about {
            background-color: #ecf0f1;
        }

        .about img {
            width: 300px;
            max-width: 100%;
            margin-top: 15px;
        }

        .services ul {
            list-style: none;
            padding: 0;
        }

        .services li {
            background-color: #ecf0f1;
            margin: 10px auto;
            padding: 12px;
            width: 50%;
        }

        .contact {
            background-color: #2c3e50;
            color: white;
        }

        .contact input, .contact textarea {
            display: block;
            width: 40%;
            margin: 10px auto;
            padding: 10px;
        }

        .contact button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px 25px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .services li {
                width: 90%;
            }

            .contact input, .contact textarea {
                width: 90%;
            }

            .hero {
                padding: 60px 20px;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>Welcome to Our Website</h1>
        <p>We provide the best services for you</p>
        <button>Get Started</button>
    </section>

    <section class="about">
        <h2>About Us</h2>
        <p>We are a small team that loves to build good websites. Our goal is to help people and businesses grow online.</p>
        <img src="images/pic1.jpg" alt="About Us">
    </section>

    <section class="services">
        <h2>Our Services</h2>
        <ul>
            <li>Web Design</li>
            <li>Web Development</li>
            <li>Digital Marketing</li>
            <li>Technical Support</li>
        </ul>
    </section>

    <section class="contact">
        <h2>Contact Us</h2>
        <form>
            <input type="text" placeholder="Your Name">
            <input type="email" placeholder="Your Email">
            <textarea rows="5" placeholder="Your Message"></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

</body>
</html>
